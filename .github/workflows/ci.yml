name: Validate
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:data
      - run: npm run test:unit
      - run: npm audit --audit-level=moderate
      - run: npm run build
      # 浏览器缓存 key 绑定 package-lock.json 哈希：依赖没变就直接命中，避免每次重下
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # 只装 chromium：e2e 用例全部跑在 chromium 上，装 firefox/webkit 纯属浪费
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
  # PWA 专项（webkit）：README 明确主目标是 iPhone 主屏，
# Safari 的 SW 安装 / 离线 / 更新提示需要单独覆
  pwa-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --project=webkit




